[package]
name = "wasl-devices"
description = "This device in a Wasl group: key, group, endpoint, pairing, discovery and internet reach, shared by wasld and the phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uniffi = { workspace = true, optional = true }
wasl-core.workspace = true
wasl-store.workspace = true
wasl-fs.workspace = true
wasl-drive.workspace = true
wasl-engine.workspace = true
wasl-net.workspace = true
wasl-chunk.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true

[features]
ffi = ["dep:uniffi"]

[lints]
workspace = true
