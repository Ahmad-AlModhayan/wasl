name: desktop

# Linux only by default; the PR label `full-ci` (or a manual run with "full") adds Windows and macOS.
# Runs on pull requests and on main, a newer commit cancels the older run.

# The Wasl tray app (Tauri 2) on the three desktop systems. wasld and the wasl CLI are crates of
# the engine workspace and are tested by the engine workflow.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'engine/crates/wasl-ipc/**', 'engine/crates/wasl-store/**', 'engine/crates/wasl-engine/**', 'engine/crates/wasl-core/**', '.github/workflows/desktop.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['desktop/**', 'engine/crates/wasl-ipc/**', 'engine/crates/wasl-store/**', 'engine/crates/wasl-engine/**', 'engine/crates/wasl-core/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      full:
        description: Also Windows and macOS
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Private design package token
        # The desktop app and the website need Kahf Labs' private @kahf/design package. Fork pull requests and the
        # public repository have no KAHF_DESIGN_READ_TOKEN, so the steps below are skipped (the job stays green).
        # A secret can't sit in a step's `if`, so this step turns "is it set" into an output.
        id: tok
        shell: bash
        env:
          TOKEN: ${{ secrets.KAHF_DESIGN_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KAHF_DESIGN_READ_TOKEN is not set (fork pull request or public repository), so the desktop app build is skipped: it needs Kahf Labs' private @kahf/design package. The engine, CLI and Android workflows don't need it."
          fi
      - name: Linux webview and tray libraries
        if: steps.tok.outputs.have_token == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - if: steps.tok.outputs.have_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust toolchain (pinned like the engine's)
        if: steps.tok.outputs.have_token == 'true'
        working-directory: desktop/src-tauri
        run: rustup show active-toolchain
      - if: steps.tok.outputs.have_token == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Read access to the private @kahf/design
        if: steps.tok.outputs.have_token == 'true'
        # npm ci fetches it from GitHub over git+ssh; this sends that to HTTPS with a read-only token (fine-grained,
        # kahf-design only, stored as the repository secret KAHF_DESIGN_READ_TOKEN).
        shell: bash
        env:
          TOKEN: ${{ secrets.KAHF_DESIGN_READ_TOKEN }}
        run: |
          # actions/checkout leaves this repository's GITHUB_TOKEN as an extra header for github.com, and git sends it
          # in place of the token above: kahf-design then answers "Repository not found".
          git config --local --unset-all http.https://github.com/.extraheader || true
          # Only kahf-design's URLs get the token, in each form npm may try.
          repo=github.com/Ahmad-AlModhayan/kahf-design
          to="url.https://x-access-token:${TOKEN}@${repo}.insteadOf"
          git config --global "$to" "ssh://git@${repo}"
          git config --global --add "$to" "git@github.com:Ahmad-AlModhayan/kahf-design"
          git config --global --add "$to" "https://${repo}"
      - if: steps.tok.outputs.have_token == 'true'
        run: npm ci
      - if: steps.tok.outputs.have_token == 'true'
        run: npm test
      # The window at real sizes in headless Chrome (#203): nothing overlaps, no blue button turns black on hover.
      - if: steps.tok.outputs.have_token == 'true'
        run: npm run test:layout -- --quick
      - if: steps.tok.outputs.have_token == 'true'
        run: npm run build
      - name: Clippy
        if: steps.tok.outputs.have_token == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: App executable
        if: steps.tok.outputs.have_token == 'true'
        run: npx tauri build --no-bundle
