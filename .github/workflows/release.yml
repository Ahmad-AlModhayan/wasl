name: release

# Installers on demand (SRS FR-R5): the Windows setup (.exe, NSIS) and .msi, and the macOS .dmg
# (Apple silicon), each with wasld and the wasl CLI inside. Run it from the Actions tab; the files are
# the run's artifacts. Not signed yet: Windows SmartScreen and macOS Gatekeeper warn on first open
# (on the Mac: right-click the app, Open). Signing and notarisation come with M6.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            out: desktop/src-tauri/target/release/bundle
          - os: macos-latest
            bundles: dmg
            out: desktop/src-tauri/target/release/bundle/dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Private design package token
        # The desktop app and the website need Kahf Labs' private @kahf/design package. Fork pull requests and the
        # public repository have no KAHF_DESIGN_READ_TOKEN, so the steps below are skipped (the job stays green).
        # A secret can't sit in a step's `if`, so this step turns "is it set" into an output.
        id: tok
        shell: bash
        env:
          TOKEN: ${{ secrets.KAHF_DESIGN_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NO RELEASE BUILT: KAHF_DESIGN_READ_TOKEN is not set (fork pull request or public repository), so the installer build is skipped: it needs Kahf Labs' private @kahf/design package. The engine, CLI and Android workflows don't need it."
          fi
      - if: steps.tok.outputs.have_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: steps.tok.outputs.have_token == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            desktop/src-tauri
      - name: Read access to the private @kahf/design
        if: steps.tok.outputs.have_token == 'true'
        # npm ci fetches it from GitHub over git+ssh; this sends that to HTTPS with a read-only token (fine-grained,
        # kahf-design only, stored as the repository secret KAHF_DESIGN_READ_TOKEN).
        shell: bash
        env:
          TOKEN: ${{ secrets.KAHF_DESIGN_READ_TOKEN }}
        run: |
          # actions/checkout leaves this repository's GITHUB_TOKEN as an extra header for github.com, and git sends it
          # in place of the token above: kahf-design then answers "Repository not found".
          git config --local --unset-all http.https://github.com/.extraheader || true
          # Only kahf-design's URLs get the token, in each form npm may try.
          repo=github.com/Ahmad-AlModhayan/kahf-design
          to="url.https://x-access-token:${TOKEN}@${repo}.insteadOf"
          git config --global "$to" "ssh://git@${repo}"
          git config --global --add "$to" "git@github.com:Ahmad-AlModhayan/kahf-design"
          git config --global --add "$to" "https://${repo}"
      - if: steps.tok.outputs.have_token == 'true'
        run: npm ci
      - if: steps.tok.outputs.have_token == 'true'
        run: node scripts/stage-engine.mjs
      - if: steps.tok.outputs.have_token == 'true'
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - if: steps.tok.outputs.have_token == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasl-${{ runner.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error
