name: android

# The Android app on libwasl (SRS FR-E1): the engine cross-built for the device ABIs, the Kotlin
# bindings generated from it, the JVM tests (which load a host build of the same engine) and a
# debug APK.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['app/**', 'engine/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['app/**', 'engine/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships the Android SDK; only the pinned NDK is added.
      - name: NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
      - name: Rust targets and cargo-ndk
        working-directory: engine
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/test-results/
          if-no-files-found: ignore
