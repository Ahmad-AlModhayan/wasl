name: Idea or feature request
description: Suggest a change to Wasl
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
