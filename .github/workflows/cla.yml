name: cla

# CLA Assistant (the free GitHub Action): comments on a pull request until its author has signed CLA.md.
# pull_request_target runs this workflow from the base branch with write access and does NOT check out the
# pull request's code, so a fork cannot run its own code here. Keep it that way: never add a checkout step.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Ahmad-AlModhayan/wasl/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Ahmad-AlModhayan,dependabot[bot],github-actions[bot]
