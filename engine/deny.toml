# cargo-deny: the dependency gate before every release (docs/SECURITY.md S5-2). Shared by both Rust
# workspaces: the engine (`cd engine && cargo deny check`) and the desktop app
# (`cargo deny --manifest-path desktop/src-tauri/Cargo.toml check --config engine/deny.toml`).
# `tools/security-check.sh` runs both, with `cargo audit` and `npm audit`.

[graph]
# Every platform Wasl ships on: a crate pulled in only for one of them is still shipped.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
all-features = true

[advisories]
# Vulnerabilities and unsound code are always errors in cargo-deny 0.18+. Unmaintained crates are
# reported for the whole graph; one we must keep for now goes in `ignore` with its reason, which
# cargo-deny still prints on every run (a warning that stays visible, not a silent pass).
unmaintained = "all"
yanked = "deny"
ignore = [
    # zbus 4's helper crates (2026-10): Linux secret-service access in `wasld`, through
    # `keyring` 3.6's `async-secret-service`. No vulnerability; the fix is keyring on zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, not vulnerable: zvariant via keyring 3 (Linux secret service); move to zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, not vulnerable: zbus_names via keyring 3 (Linux secret service); move to zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, not vulnerable: zvariant_derive via keyring 3 (Linux secret service); move to zbus 5" },
    # Build time only: askama's derive macro reads its config with it (uniffi's binding generator).
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, not vulnerable, build-time only (askama_derive via uniffi_bindgen)" },
    # Desktop only, build time only: gtk-rs 0.18's derive macros (Tauri's Linux tray and webview).
    { id = "RUSTSEC-2024-0370", reason = "unmaintained, not vulnerable, build-time only (proc-macro-error via glib-macros 0.18, Tauri on Linux)" },
]
# The list is shared by both workspaces, so an entry only one of them hits is expected.
unused-ignored-advisory = "allow"

[licenses]
# Derived from `cargo metadata` of both workspaces (2026-10-26), not guessed: every license that
# some dependency needs, alone or as part of an AND. Expressions with OR need only one of these.
# No strong copyleft (GPL, AGPL, LGPL): r-efi's "MIT OR Apache-2.0 OR LGPL-2.1-or-later" is taken
# as MIT/Apache-2.0. MPL-2.0 (file-level copyleft) is allowed: uniffi and option-ext (engine),
# cssparser, selectors and dtoa-short (desktop, via Tauri), all used unmodified.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# Wasl's own crates are unpublished (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Wasl's own unpublished crates carry no version.
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
